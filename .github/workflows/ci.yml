name: Modern CI

on:
  push:
    branches: [ main ]  # Run on pushes made into the main branch
  pull_request:
    branches: [ main ]  # Run on pull requests targeting the main branch

jobs:
  quality-checks:
    runs-on: ubuntu-latest  # Specify the OS to run the job

    steps:
      - uses: actions/checkout@v4  # Checks out your repository's code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Specify the Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Install your project dependencies

      - name: Run tests
        run: |
          pytest test_model.py  # Run your tests
